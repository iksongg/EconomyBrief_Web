<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.ico" />
<title>이코노미브리프 - 알림설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="design-system/tokens/colors.css" />
<link rel="stylesheet" href="design-system/tokens/typography.css" />
<link rel="stylesheet" href="design-system/tokens/layout.css" />
<link rel="stylesheet" href="assets/css/common.css" />
<link rel="stylesheet" href="assets/css/device-mockup.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .scroll-area { padding-bottom: 20px; }
  .section-white { background: #ffffff; padding: 20px; }
  .section-title-row { margin-bottom: 4px; }
  .section-title-row h2 { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; }

  .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--color-border-default); gap: 12px; }
  .setting-row:last-child { border-bottom: none; padding-bottom: 0; }
  .setting-row .setting-info { display: flex; flex-direction: column; gap: 2px; }
  .setting-row .setting-label { font-weight: var(--font-weight-medium); font-size: 14px; color: #000; }
  .setting-row .setting-desc { font-weight: var(--font-weight-regular); font-size: 12px; color: #5B5E73; }
</style>
</head>
<body>

<div class="portfolio-stage">
<div class="iphone-device">
<div class="device-bezel">
<div class="app-screen">
<div class="dynamic-island"></div>
<div class="ios-status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <img src="assets/img/icons/status-bar-levels.svg" alt="" width="100" height="22" />
  </div>
</div>

<div class="device">
  <div class="scroll-area">

    <div data-eb="nav-header" data-title="알림설정" data-back="mypage.html" data-right="none" data-short="true"></div>

    <div class="section-white">
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">뉴스 알림</div>
          <div class="setting-desc">새로운 기사가 올라오면 알려드려요.</div>
        </div>
        <label class="eb-toggle"><input type="checkbox" data-key="news" /><span class="track"></span><span class="thumb"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">주요 경제 뉴스</div>
          <div class="setting-desc">금리·환율 등 주요 이슈를 우선 알려드려요.</div>
        </div>
        <label class="eb-toggle"><input type="checkbox" data-key="majorEconomy" /><span class="track"></span><span class="thumb"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">AI 리포트 알림</div>
          <div class="setting-desc">딥 리서치 분석이 완료되면 알려드려요.</div>
        </div>
        <label class="eb-toggle"><input type="checkbox" data-key="aiReport" /><span class="track"></span><span class="thumb"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">데일리 브리핑</div>
          <div class="setting-desc">매일 정해진 시간에 브리핑을 알려드려요.</div>
        </div>
        <label class="eb-toggle"><input type="checkbox" data-key="dailyBriefing" /><span class="track"></span><span class="thumb"></span></label>
      </div>
    </div>

  </div>
</div>
</div>
</div>
</div>
</div>

<script src="assets/js/device-mockup.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script>
  var settings = EB.settings.load();
  document.querySelectorAll('.eb-toggle input[data-key]').forEach(function (input) {
    var key = input.getAttribute('data-key');
    input.checked = !!settings.notifications[key];
    input.addEventListener('change', function () {
      EB.settings.update(function (state) { state.notifications[key] = input.checked; });
    });
  });
</script>

</body>
</html>

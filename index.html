<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.ico" />
<title>이코노미브리프 - 온보딩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="design-system/tokens/colors.css" />
<link rel="stylesheet" href="design-system/tokens/typography.css" />
<link rel="stylesheet" href="design-system/tokens/layout.css" />
<link rel="stylesheet" href="assets/css/common.css" />
<link rel="stylesheet" href="assets/css/device-mockup.css" />
<style>
  :root {
    --color-primary: #2461FA;
    --color-text-primary: #000000;
    --color-text-secondary: #6C6C6C;
    --color-border: #E6E7EB;
    --color-dot-inactive: #D9D9D9;
    --color-pill-text: #2D2D2D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* .device (assets/css/common.css) is sized to the real viewport: width up to 402px,
     height:100dvh, overflow hidden. Every .page's children below use absolute px
     coordinates authored against the original 402x874 Figma frame, so .onboard-canvas
     is pinned at that exact native size and scaled down (via JS, see bottom of file)
     to fit whatever .device's actual box is — this fills the screen top-to-bottom
     with no scrolling and nothing cut off, instead of clipping content that no
     longer fits a shorter real viewport. */
  .device { display: flex; align-items: center; justify-content: center; }
  .onboard-canvas {
    position: relative;
    width: 402px;
    height: 874px;
    flex-shrink: 0;
    transform-origin: center center;
  }

  .page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    display: none;
  }
  .page.active { display: block; }

  /* skip row (fixed chrome) — a dedicated 402x44 band sitting flush under
     the status bar (44/46px, per the Figma frame and assets/css/device-mockup.css),
     not a title-relative offset. top/height anchor it there directly. */
  .skip-row {
    position: absolute;
    top: 1%;
    left: 0;
    width: 100%;
    height: 44px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    z-index: 2;
  }
  .skip-row button {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }
  .skip-row span {
    font-size: 14px;
    color: var(--color-text-secondary);
    white-space: nowrap;
  }
  .skip-row .gicon { font-size: 14px; width: 14px; height: 14px; color: var(--color-text-secondary); }

  /* draggable content section: circle-bg + hero-img + intro-text */
  .content-track {
    position: absolute;
    top: 0;
    left: 0;
    width: 400%;
    height: 100%;
    display: flex;
    touch-action: none;
    cursor: grab;
    will-change: transform;
    z-index: 1;
  }
  .content-track.dragging { cursor: grabbing; }
  .content-track img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

  .content-slide {
    flex: 0 0 25%;
    width: 25%;
    height: 100%;
    position: relative;
  }

  .circle-bg {
    position: absolute;
    top: 295px;
    width: 260px;
    height: 260px;
  }
  .hero-img {
    position: absolute;
    width: 281.822px;
    height: 324px;
    object-fit: contain;
    pointer-events: none;
  }

  .intro-text {
    position: absolute;
    top: 10%;
    left: 0;
    width: 100%;
    padding: 0 30px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .intro-text h1 {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.3;
  }
  .intro-text h1 .line-primary { color: #000000; }
  .intro-text h1 .line-accent { color: var(--color-primary); display: block; }
  .intro-text p {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.3;
    color: #000000;
    white-space: nowrap;
  }

  /* dots (fixed chrome) */
  .dots {
    position: absolute;
    top: 612px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    height: 5px;
    z-index: 2;
  }
  .dots .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--color-dot-inactive);
    cursor: pointer;
  }
  .dots .dot.active { background: var(--color-primary); }

  /* CTA button (fixed chrome) */
  .cta {
    position: absolute;
    top: 758px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 369px;
    z-index: 2;
  }
  .cta button {
    width: 100%;
    height: 60px;
    background: var(--color-primary);
    border: none;
    border-radius: 16px;
    color: #ffffff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
    cursor: pointer;
  }

  /* keyword selection page */
  .keyword-title {
    position: absolute;
    top: 125px;
    left: 0;
    width: 100%;
    padding: 0 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .keyword-title h1 {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.3;
    color: #000000;
    text-align: center;
  }
  .keyword-count {
    font-size: 14px;
    color: var(--color-text-secondary);
  }
  .keyword-count strong {
    color: #000000;
    font-weight: 700;
  }

  .keyword-grid {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% + 13.35px));
    width: 293px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .keyword-row {
    display: flex;
    gap: 8px;
    height: 53.176px;
    width: 100%;
  }
  .pill {
    flex: 1 0 0;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    background: #ffffff;
    border: 1.108px solid var(--color-border);
    color: var(--color-pill-text);
    font-size: 19.64px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    padding: 0 12px;
  }
  .pill.regular { color: #000000; font-weight: 400; font-size: 17.73px; }
  .pill.active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #ffffff;
    font-weight: 600;
  }

  .skip-later {
    position: absolute;
    top: 727px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #212121;
    white-space: nowrap;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 144px;
    height: 5px;
    border-radius: 100px;
    background: #000000;
  }
</style>
</head>
<body>

<div class="dynamic-island"></div>

      <div class="content-slide">

        <img class="hero-img" style="left:calc(50% - 141.001px); top:265px;" src="assets/img/hero-2.png" alt="어려운 경제도 쉽게 이해하세요" />
        <div class="intro-text">

        <img class="hero-img" style="left:calc(50% - 141.001px); top:252px;" src="assets/img/hero-3.png" alt="AI가 대신 분석하는 Deep Research" />

    <div class="dots" id="intro-dots">

  <!-- Page 2: 온보딩5 - 키워드 선택 (page-intro 마지막 슬라이드에서 스와이프/도트로 연결됨) -->

    <div class="keyword-title">

      <p class="keyword-count">5개 중 <strong id="keyword-selected-count">0</strong>개 선택</p>

        <button type="button" class="pill">ESG</button>
      </div>
      <div class="keyword-row">
        <button type="button" class="pill">정책</button>
        <button type="button" class="pill">부동산</button>
        <button type="button" class="pill">채권</button>
      </div>
      <div class="keyword-row">
        <button type="button" class="pill">금리</button>
        <button type="button" class="pill">정치</button>
        <button type="button" class="pill">암호화폐</button>
      </div>
      <div class="keyword-row">
        <button type="button" class="pill">환율</button>
        <button type="button" class="pill">미국증시</button>
        <button type="button" class="pill">물가</button>
      </div>
    </div>
    <button type="button" class="skip-later" data-external="main.html">다음에 설정하기</button>
    <div class="cta"><button type="button" data-external="main.html">저장하기</button></div>
    <div class="home-indicator"></div>
  </div>

</div>
</div>
</div>
</div>
</div>
</div>

<script src="assets/js/device-mockup.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script>
  (function () {
    var device = document.querySelector('.device');
    var canvas = document.getElementById('onboard-canvas');

    function fitCanvas() {
      var scale = Math.min(1, device.clientWidth / 402, device.clientHeight / 874);
      canvas.style.transform = 'scale(' + scale + ')';
    }

    fitCanvas();
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', fitCanvas);
  })();

  (function () {
    var contentTrack = document.getElementById('content-track');
    var slideWidth = contentTrack.parentElement.clientWidth;
    // Only the 4 teaser slides live in the horizontal content-track; onboarding's
    // 5th screen is #page-keywords, reached by swiping past the last teaser or
    // tapping the 5th dot (see endDrag / #intro-dots click handler below).
    var totalSlides = 4;
    var currentIndex = 0;
    var isDragging = false;
    var startX = 0;
    var startTranslate = 0;
    var dragMoved = false;
    var dragMoveThreshold = 8;
    var swipeThreshold = 60;

    function setTranslate(px, animate) {
      contentTrack.style.transition = animate ? 'transform 0.3s ease' : 'none';
      contentTrack.style.transform = 'translateX(' + px + 'px)';
    }

    function updateDots() {
      document.querySelectorAll('#intro-dots .dot').forEach(function (dot, i) {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function goToContentSlide(index, animate) {
      currentIndex = Math.max(0, Math.min(totalSlides - 1, index));
      setTranslate(-currentIndex * slideWidth, animate !== false);
      updateDots();
    }

    window.addEventListener('resize', function () {
      slideWidth = contentTrack.parentElement.clientWidth;
      goToContentSlide(currentIndex, false);
    });

    contentTrack.addEventListener('pointerdown', function (e) {
      isDragging = true;
      dragMoved = false;
      startX = e.clientX;
      startTranslate = -currentIndex * slideWidth;
      contentTrack.classList.add('dragging');
      contentTrack.setPointerCapture(e.pointerId);
    });

    contentTrack.addEventListener('pointermove', function (e) {
      if (!isDragging) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > dragMoveThreshold) dragMoved = true;
      var next = startTranslate + dx;
      var min = -(totalSlides - 1) * slideWidth;
      var max = 0;
      if (next > max) next = max + (next - max) * 0.3;
      if (next < min) next = min + (next - min) * 0.3;
      setTranslate(next, false);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      contentTrack.classList.remove('dragging');
      var dx = e.clientX - startX;
      if (dx < -swipeThreshold && currentIndex === totalSlides - 1) {
        showPage('keywords');
        return;
      }
      var target = currentIndex;
      if (dx < -swipeThreshold) target = currentIndex + 1;
      else if (dx > swipeThreshold) target = currentIndex - 1;
      goToContentSlide(target);
    }

    contentTrack.addEventListener('pointerup', endDrag);
    contentTrack.addEventListener('pointercancel', endDrag);

    contentTrack.addEventListener('click', function (e) {
      if (dragMoved) {
        e.stopPropagation();
        e.preventDefault();
        dragMoved = false;
      }
    }, true);

    document.querySelectorAll('#intro-dots .dot').forEach(function (dot, i) {
      dot.addEventListener('click', function () {
        // The 4th dot has no matching content-track slide (see totalSlides
        // above) — it stands for the #page-keywords screen instead.
        if (i >= totalSlides) {
          showPage('keywords');
          return;
        }
        goToContentSlide(i);
      });
    });

    function showPage(name) {
      document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
      document.getElementById('page-' + name).classList.add('active');
      if (name === 'intro') goToContentSlide(0, false);
    }

    document.querySelectorAll('[data-goto]').forEach(function (el) {
      el.addEventListener('click', function () {
        showPage(el.getAttribute('data-goto'));
      });
    });

    document.querySelectorAll('[data-external]').forEach(function (el) {
      el.addEventListener('click', function () {
        if (el.getAttribute('data-external') === 'main.html' && el.textContent.indexOf('저장하기') >= 0) {
          var keywords = Array.prototype.map.call(document.querySelectorAll('.keyword-grid .pill.active'), function (pill) {
            return pill.textContent.trim();
          });
          EB.appState.saveKeywords(keywords);
        }
        window.location.href = el.getAttribute('data-external');
      });
    });

    var MAX_KEYWORDS = 5;

    function updateKeywordCount() {
      var countEl = document.getElementById('keyword-selected-count');
      if (!countEl) return;
      countEl.textContent = document.querySelectorAll('.keyword-grid .pill.active').length;
    }

    document.querySelectorAll('.keyword-grid .pill').forEach(function (el) {
      el.addEventListener('click', function () {
        var isActive = el.classList.contains('active');
        var activeCount = document.querySelectorAll('.keyword-grid .pill.active').length;
        if (!isActive && activeCount >= MAX_KEYWORDS) return;
        el.classList.toggle('active');
        updateKeywordCount();
      });
    });
    updateKeywordCount();

    goToContentSlide(0, false);
  })();
</script>

</body>
</html>

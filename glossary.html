<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.ico" />
<title>이코노미브리프 - 내 용어장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="design-system/tokens/colors.css" />
<link rel="stylesheet" href="design-system/tokens/typography.css" />
<link rel="stylesheet" href="design-system/tokens/layout.css" />
<link rel="stylesheet" href="assets/css/common.css" />
<link rel="stylesheet" href="assets/css/device-mockup.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .scroll-area { padding-bottom: 20px; }

  .section-white { background: #ffffff; padding: 20px; }

  .hero-card { background: #F8F8FC; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .hero-card .hero-icon { width: 72px; height: 72px; border-radius: 36px; background: #B5CBFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .hero-card .hero-icon img { width: 53px; height: 47.247px; object-fit: contain; }
  .hero-card .hero-text { display: flex; flex-direction: column; gap: 5px; }
  .hero-card .hero-label { font-weight: var(--font-weight-medium); font-size: 12px; color: #000; }
  .hero-card .hero-count { font-weight: var(--font-weight-semibold); font-size: 24px; color: #000; }
  .hero-card .hero-sub { font-weight: var(--font-weight-regular); font-size: 14px; color: #5B5E73; margin-top: 0; }

  .filter-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--color-border-default); }
  .filter-row .filter-item { display: flex; align-items: center; gap: 2px; font-size: 14px; color: #000; background: none; border: none; font-family: inherit; cursor: pointer; }
  .filter-row .filter-item .gicon { font-size: 24px; width: 24px; height: 24px; color: #1C1B1F; }

  .term-list { display: flex; flex-direction: column; margin-top: 28px; }
  .term-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--color-border-default); gap: 12px; }
  .term-item:first-child { padding-top: 0; }
  .term-item:last-child { border-bottom: none; }
  .term-info { display: flex; flex-direction: column; gap: 12px; width: 246px; }
  .term-info .term-name { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; line-height: 1.3; }
  .term-info .term-def { font-weight: var(--font-weight-regular); font-size: 14px; color: #000; line-height: 1.6; margin-top: 4px; }
  .term-meta { display: flex; align-items: center; gap: 4px; }
  .term-meta .term-tag { background: #F3F2FE; border-radius: 999px; padding: 4px 10px; font-size: 10px; color: #6140E9; }
  .term-meta .term-date { font-size: 10px; color: #5B5E73; }
  .term-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .term-actions .bookmark-btn { background: none; border: none; padding: 0; cursor: pointer; display: block; }
  .term-actions .bookmark-btn .gicon { font-size: 30px; width: 30px; height: 30px; color: var(--color-brand-600); font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  .term-actions .select-btn { background: none; border: none; padding: 0; cursor: pointer; display: none; }
  .term-actions .select-btn .gicon { font-size: 26px; width: 26px; height: 26px; color: #B5BAC5; }
  .term-item.selected .select-btn .gicon { color: var(--color-brand-600); font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  .term-list.editing .select-btn { display: block; }
  .term-list.editing .bookmark-btn { display: none; }
  .term-list.editing .term-item { cursor: pointer; }
  .term-item.selected { background: #F8F8FC; margin: 0 -20px; padding-left: 20px; padding-right: 20px; border-radius: 12px; }

  .bulk-delete-btn {
    display: none; width: 100%; height: 48px; margin-top: 16px; border-radius: 999px; border: none;
    background: var(--color-brand-600); color: #fff; font-family: inherit;
    font-weight: var(--font-weight-semibold); font-size: 14px; cursor: pointer;
  }
  .bulk-delete-btn:disabled { background: #E6E7EB; color: #9CA0AC; cursor: not-allowed; }
  .term-list.editing ~ .bulk-delete-btn { display: block; }

  .empty-state { padding: 40px 0; text-align: center; color: #5B5E73; font-size: 14px; }
</style>
</head>
<body>

<div class="portfolio-stage">
<div class="iphone-device">
<div class="device-bezel">
<div class="app-screen">
<div class="dynamic-island"></div>
<div class="ios-status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <img src="assets/img/icons/status-bar-levels.svg" alt="" width="100" height="22" />
  </div>
</div>

<div class="device">
  <div class="scroll-area">

    <div data-eb="nav-header" data-title="내 용어장" data-back="mypage.html" data-right="text" data-right-label="편집" data-short="true"></div>

    <div class="section-white">
      <div class="hero-card">
        <div class="hero-icon"><img src="assets/img/glossary-hero-illust.png" alt="" /></div>
        <div class="hero-text">
          <div>
            <div class="hero-label">저장된 용어</div>
            <div class="hero-count" id="term-count">0개</div>
          </div>
          <div class="hero-sub">나만의 경제 용어장을 만들어보세요.</div>
        </div>
      </div>
    </div>

    <div class="section-white" style="padding-top:0;">
      <div class="filter-row">
        <button type="button" class="filter-item"><span class="gicon" role="img" aria-label="">folder</span><span>카테고리</span></button>
        <button type="button" class="filter-item"><span class="gicon" role="img" aria-label="">sync_alt</span><span>최근 추가순</span></button>
      </div>
      <div class="term-list" id="term-list"></div>
      <div class="empty-state" id="empty-state" style="display:none;">아직 저장한 용어가 없어요.<br />기사 속 밑줄 친 용어를 눌러 저장해보세요.</div>
      <button type="button" class="bulk-delete-btn" id="bulk-delete-btn" disabled>삭제할 용어를 선택하세요</button>
    </div>

  </div>
</div>
</div>
</div>
</div>
</div>

<script src="assets/js/device-mockup.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script>
  var editing = false;
  var selected = new Set();
  var listEl = document.getElementById('term-list');
  var countEl = document.getElementById('term-count');
  var bulkBtn = document.getElementById('bulk-delete-btn');

  function updateBulkBtn() {
    bulkBtn.disabled = selected.size === 0;
    bulkBtn.textContent = selected.size ? '선택한 ' + selected.size + '개 삭제' : '삭제할 용어를 선택하세요';
  }

  function toggleSelect(term) {
    if (selected.has(term)) selected.delete(term); else selected.add(term);
    updateBulkBtn();
    render();
  }

  function render() {
    var terms = EB.glossary.getAll();
    countEl.textContent = EB.glossary.count() + '개';
    document.getElementById('empty-state').style.display = terms.length ? 'none' : 'block';

    listEl.textContent = '';
    terms.forEach(function (t) {
      var isSelected = selected.has(t.term);
      var item = document.createElement('div');
      item.className = 'term-item' + (isSelected ? ' selected' : '');
      var info = document.createElement('div');
      info.className = 'term-info';
      var copy = document.createElement('div');
      var name = document.createElement('div');
      name.className = 'term-name';
      name.textContent = t.term;
      var definition = document.createElement('div');
      definition.className = 'term-def';
      definition.textContent = t.definition;
      copy.append(name, definition);
      var meta = document.createElement('div');
      meta.className = 'term-meta';
      var category = document.createElement('span');
      category.className = 'term-tag';
      category.textContent = t.category;
      var date = document.createElement('span');
      date.className = 'term-date';
      date.textContent = t.date + ' 추가';
      meta.append(category, date);
      info.append(copy, meta);
      var actions = document.createElement('div');
      actions.className = 'term-actions';

      // Saved icon: click unsaves the term (removes it from the store) and it
      // drops out of the list on the next render. Only interactive outside
      // edit mode (hidden while editing, see .term-list.editing .bookmark-btn).
      var bookmark = document.createElement('button');
      bookmark.type = 'button';
      bookmark.className = 'bookmark-btn';
      var bookmarkIcon = document.createElement('span');
      bookmarkIcon.className = 'gicon';
      bookmarkIcon.setAttribute('role', 'img');
      bookmarkIcon.setAttribute('aria-label', '저장됨, 눌러서 저장 해제');
      bookmarkIcon.textContent = 'bookmark';
      bookmark.appendChild(bookmarkIcon);
      bookmark.addEventListener('click', function () {
        EB.glossary.remove(t.term);
        selected.delete(t.term);
        render();
      });

      // Multi-select circle: only shown/interactive in edit mode. Picks the
      // term for the bulk-delete button below instead of removing it right away.
      var selectBtn = document.createElement('button');
      selectBtn.type = 'button';
      selectBtn.className = 'select-btn';
      var selectIcon = document.createElement('span');
      selectIcon.className = 'gicon';
      selectIcon.setAttribute('role', 'img');
      selectIcon.setAttribute('aria-label', isSelected ? '선택됨' : '선택 안 됨');
      selectIcon.textContent = isSelected ? 'check_circle' : 'radio_button_unchecked';
      selectBtn.appendChild(selectIcon);
      selectBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleSelect(t.term);
      });

      actions.append(bookmark, selectBtn);
      item.append(info, actions);
      item.addEventListener('click', function () {
        if (editing) toggleSelect(t.term);
      });
      listEl.appendChild(item);
    });
  }

  render();
  updateBulkBtn();

  document.querySelectorAll('.filter-row .filter-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      EB.showToast('서비스 준비중입니다.');
    });
  });

  bulkBtn.addEventListener('click', function () {
    selected.forEach(function (term) { EB.glossary.remove(term); });
    selected.clear();
    editing = false;
    listEl.classList.remove('editing');
    var navEditBtn = document.querySelector('.nav-header-common .nav-text-btn');
    if (navEditBtn) navEditBtn.textContent = '편집';
    updateBulkBtn();
    render();
  });

  // the nav-header "편집" button is injected by common.js on DOMContentLoaded,
  // so wire it up right after that (setTimeout 0 runs after all DOMContentLoaded listeners)
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var navEditBtn = document.querySelector('.nav-header-common .nav-text-btn');
      if (!navEditBtn) return;
      navEditBtn.addEventListener('click', function () {
        editing = !editing;
        navEditBtn.textContent = editing ? '완료' : '편집';
        listEl.classList.toggle('editing', editing);
        if (!editing) { selected.clear(); updateBulkBtn(); render(); }
      });
    }, 0);
  });
</script>

</body>
</html>

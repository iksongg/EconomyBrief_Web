<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.ico" />
<title>이코노미브리프 - 다크모드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="design-system/tokens/colors.css" />
<link rel="stylesheet" href="design-system/tokens/typography.css" />
<link rel="stylesheet" href="design-system/tokens/layout.css" />
<link rel="stylesheet" href="assets/css/common.css" />
<link rel="stylesheet" href="assets/css/device-mockup.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .scroll-area { padding-bottom: 20px; }
  .section-white { background: #ffffff; padding: 20px; }

  .theme-option {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    padding: 16px; border-radius: 16px; border: 1px solid var(--color-border-default);
    background: none; font-family: inherit; cursor: pointer; text-align: left; margin-bottom: 12px;
  }
  .theme-option:last-child { margin-bottom: 0; }
  .theme-option.active { border-color: var(--color-brand-600); background: #F3F6FF; }
  .theme-option .option-left { display: flex; align-items: center; gap: 12px; }
  .theme-option .icon-badge { width: 36px; height: 36px; border-radius: 10px; background: #F1F1F1; display: flex; align-items: center; justify-content: center; color: #5F738C; }
  .theme-option.active .icon-badge { background: #DDE1FF; color: var(--color-brand-600); }
  .theme-option .icon-badge .gicon { font-size: 20px; width: 20px; height: 20px; }
  .theme-option .option-label { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; }
  .theme-option .option-desc { font-weight: var(--font-weight-regular); font-size: 12px; color: #5B5E73; margin-top: 2px; }
  .theme-option .check-icon { font-size: 22px; width: 22px; height: 22px; color: var(--color-brand-600); visibility: hidden; }
  .theme-option.active .check-icon { visibility: visible; }

  .scope-note { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: #F8F8FC; font-size: 12px; color: #5B5E73; line-height: 1.6; }
</style>
</head>
<body>

<div class="portfolio-stage">
<div class="iphone-device">
<div class="device-bezel">
<div class="app-screen">
<div class="dynamic-island"></div>
<div class="ios-status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <img src="assets/img/icons/status-bar-levels.svg" alt="" width="100" height="22" />
  </div>
</div>

<div class="device">
  <div class="scroll-area">

    <div data-eb="nav-header" data-title="다크모드" data-back="mypage.html" data-right="none" data-short="true"></div>

    <div class="section-white">
      <button type="button" class="theme-option" data-theme="light">
        <div class="option-left">
          <div class="icon-badge"><span class="gicon" role="img" aria-label="">light_mode</span></div>
          <div><div class="option-label">라이트 모드</div><div class="option-desc">밝은 화면으로 봅니다.</div></div>
        </div>
        <span class="gicon check-icon" role="img" aria-label="">check_circle</span>
      </button>
      <button type="button" class="theme-option" data-theme="dark">
        <div class="option-left">
          <div class="icon-badge"><span class="gicon" role="img" aria-label="">dark_mode</span></div>
          <div><div class="option-label">다크 모드</div><div class="option-desc">준비 중인 기능입니다.</div></div>
        </div>
        <span class="gicon check-icon" role="img" aria-label="">check_circle</span>
      </button>
      <div class="scope-note">다크 모드는 현재 준비 중입니다. 출시되면 다시 안내드릴게요.</div>
    </div>

  </div>
</div>
</div>
</div>
</div>
</div>

<script src="assets/js/device-mockup.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script>
  var settings = EB.settings.load();
  function render() {
    document.querySelectorAll('.theme-option').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === settings.theme);
    });
  }
  document.querySelectorAll('.theme-option').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var theme = btn.getAttribute('data-theme');
      if (theme === 'dark') {
        EB.showToast('현재 서비스 준비중입니다');
        return;
      }
      settings = EB.settings.update(function (state) { state.theme = theme; });
      render();
    });
  });
  render();
</script>

</body>
</html>

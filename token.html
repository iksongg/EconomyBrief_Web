<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.ico" />
<title>이코노미브리프 - 토큰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="design-system/tokens/colors.css" />
<link rel="stylesheet" href="design-system/tokens/typography.css" />
<link rel="stylesheet" href="design-system/tokens/layout.css" />
<link rel="stylesheet" href="assets/css/common.css" />
<link rel="stylesheet" href="assets/css/device-mockup.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .device { background: #F7F8FC; }
  .scroll-area { padding-bottom: 90px; }

  .top-section { background: #ffffff; padding-bottom: 20px; }

  .balance-card {
    width: 100%;
    background: #EFF6FF; border-bottom: 1px solid rgba(95,108,163,0.06);
    border-radius: 20px 20px 0 0;
    padding: 16px 20px; height: 100px;
    display: flex; align-items: center; gap: 8px;
  }
  .balance-card .coin-illust { width: 63px; height: 62px; object-fit: contain; flex-shrink: 0; }
  .balance-card .label { font-weight: var(--font-weight-semibold); font-size: 12px; color: #000; }
  .balance-card .amount { font-weight: var(--font-weight-semibold); font-size: 30px; color: var(--color-brand-600); margin-top: 0; }

  .balance-actions { width: 100%; background: #EFF6FF; display: flex; border-radius: 0 0 20px 20px; overflow: hidden; }
  .balance-actions button {
    flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 4px;
    background: none; border: none; font-family: inherit; font-weight: var(--font-weight-semibold); font-size: 14px;
    color: var(--color-brand-600); cursor: pointer;
  }
  .balance-actions button:last-child { border-left: 1px solid rgba(95,108,163,0.06); }
  .balance-actions .gicon { font-size: 18px; width: 18px; height: 18px; }

  .section-white { background: #ffffff; padding: 20px; }

  .promo-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .promo-left { display: flex; align-items: flex-start; gap: 8px; }
  .icon-badge { width: 24px; height: 24px; border-radius: 7px; background: #DCE9FE; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-badge.purple { background: #DDE1FF; }
  .icon-badge .gicon { font-size: 18px; width: 18px; height: 18px; color: var(--color-status2-blue-fill); }
  .icon-badge.purple .gicon { color: var(--color-status2-purple-fill); }
  .promo-text .promo-title { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; }
  .promo-text .promo-sub { font-weight: var(--font-weight-regular); font-size: 12px; color: #868686; margin-top: 4px; }
  .claim-btn { background: var(--color-brand-600); border: none; border-radius: 8px; padding: 6px 12px; color: #fff; font-family: inherit; font-weight: var(--font-weight-semibold); font-size: 12px; cursor: pointer; flex-shrink: 0; }

  .history-title { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; text-transform: uppercase; margin-bottom: 16px; }
  .history-list { display: flex; flex-direction: column; gap: 16px; }
  .history-row { display: flex; align-items: center; justify-content: space-between; }
  .history-left { display: flex; align-items: flex-start; gap: 8px; }
  .history-text .history-title-row { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; }
  .history-text .history-sub { font-weight: var(--font-weight-regular); font-size: 12px; color: #868686; margin-top: 4px; }
  .history-amount { padding: 4px 10px; border-radius: 8px; font-weight: var(--font-weight-semibold); font-size: 12px; }
  .history-amount.positive { color: #5B916D; }
  .history-amount.negative { color: #D64F55; }
</style>
</head>
<body>

<div class="portfolio-stage">
<div class="iphone-device">
<div class="device-bezel">
<div class="app-screen">
<div class="dynamic-island"></div>
<div class="ios-status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <img src="assets/img/icons/status-bar-levels.svg" alt="" width="100" height="22" />
  </div>
</div>

<div class="device">
  <div class="scroll-area">

    <div class="top-section">
      <div data-eb="nav-header" data-title="토큰" data-back="main.html" data-right="share" data-short="true"></div>

      <div style="padding:0 20px; width:100%;">
        <div class="balance-card">
          <img class="coin-illust" src="assets/img/token_01.png" alt="" />
          <div>
            <div class="label">보유 토큰</div>
            <div class="amount" id="token-balance">14개</div>
          </div>
        </div>
        <div class="balance-actions">
          <button type="button" id="charge-btn"><span class="gicon" role="img" aria-label="">add</span>충전하기</button>
          <button type="button" id="history-btn"><span class="gicon" role="img" aria-label="">assignment</span>이용내역</button>
        </div>
      </div>
    </div>

    <div class="section-white">
      <div class="promo-row">
        <div class="promo-left">
          <div class="icon-badge"><span class="gicon" role="img" aria-label="">redeem</span></div>
          <div class="promo-text">
            <div class="promo-title">삼성증권이 토큰 1개 선물했어요.</div>
            <div class="promo-sub">스폰서 · 바로 사용 가능</div>
          </div>
        </div>
        <button type="button" class="claim-btn">받기</button>
      </div>
    </div>

    <div class="section-white">
      <div class="history-title">최근 내역</div>
      <div class="history-list">
        <div class="history-row">
          <div class="history-left">
            <div class="icon-badge"><span class="gicon" role="img" aria-label="">news</span></div>
            <div class="history-text"><div class="history-title-row">브리핑 5건 완료</div><div class="history-sub">오늘</div></div>
          </div>
          <div class="history-amount positive">+5</div>
        </div>
        <div class="history-row">
          <div class="history-left">
            <div class="icon-badge purple"><span class="gicon" role="img" aria-label="">smart_toy</span></div>
            <div class="history-text"><div class="history-title-row">딥 리서치 사용</div><div class="history-sub">7월 22일</div></div>
          </div>
          <div class="history-amount negative">-3</div>
        </div>
        <div class="history-row">
          <div class="history-left">
            <div class="icon-badge"><span class="gicon" role="img" aria-label="">news</span></div>
            <div class="history-text"><div class="history-title-row">브리핑 4건 완료</div><div class="history-sub">7월 22일</div></div>
          </div>
          <div class="history-amount positive">+5</div>
        </div>
        <div class="history-row">
          <div class="history-left">
            <div class="icon-badge"><span class="gicon" role="img" aria-label="">redeem</span></div>
            <div class="history-text"><div class="history-title-row">연속 7일 출석 보너스</div><div class="history-sub">7월 21일</div></div>
          </div>
          <div class="history-amount positive">+3</div>
        </div>
      </div>
    </div>

  </div>

  <div data-eb="tab-bar" data-active="token"></div>
</div>
</div>
</div>
</div>
</div>

<script src="assets/js/device-mockup.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script>
  var tokenState = EB.appState.load();
  var tokenBalance = document.getElementById('token-balance');
  var claimButton = document.querySelector('.claim-btn');
  tokenBalance.textContent = tokenState.tokens + '개';
  if (tokenState.sponsorGiftClaimed) {
    claimButton.textContent = '받음';
    claimButton.disabled = true;
  }
  document.getElementById('charge-btn').addEventListener('click', function () {
    window.location.href = 'daily-briefing.html';
  });
  document.getElementById('history-btn').addEventListener('click', function () {
    document.querySelector('.history-list').scrollIntoView({ behavior: 'smooth' });
  });
  claimButton.addEventListener('click', function (event) {
    var button = event.currentTarget;
    if (button.disabled) return;
    var result = EB.appState.claimSponsorGift();
    if (!result.claimed) return;
    tokenBalance.textContent = result.state.tokens + '개';
    var row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = '<div class="history-left"><div class="icon-badge"><span class="gicon" role="img" aria-label="">redeem</span></div><div class="history-text"><div class="history-title-row">삼성증권 토큰 선물</div><div class="history-sub">방금</div></div></div><div class="history-amount positive">+1</div>';
    document.querySelector('.history-list').prepend(row);
    button.textContent = '받음';
    button.disabled = true;
  });
</script>

</body>
</html>

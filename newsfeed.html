<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .device { background: #ffffff; }
  .scroll-area { padding-bottom: 90px; }

  /* reset native button chrome — every "button" below is a layout container, not a form control */
  button {
    appearance: none; -webkit-appearance: none;
    background: none; border: none; box-shadow: none; outline: none;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }

  .filter-row { display: flex; gap: 4px; padding: 20px; overflow-x: auto; background: #fff; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-row button {
    flex-shrink: 0; height: 36px; border-radius: 50px; padding: 0 17px; font-size: 16px;
    background: #fff; border: 1px solid var(--color-border-default); color: #000;
  }
  .filter-row button.active { background: var(--color-brand-600); border-color: var(--color-brand-600); color: #fff; font-weight: var(--font-weight-bold); }

  .trending-card {
    background: #F6F7FB; border-radius: 16px; padding: 16px; margin: 0 20px 0; display: flex; flex-direction: column; gap: 8px;
  }
  .trending-card .tc-label { font-weight: var(--font-weight-bold); font-size: 12px; color: #000; }
  .trending-card .tc-viewport { overflow: hidden; width: 100%; }
  .trending-card .tc-track { display: flex; flex-direction: column; transition: transform 0.5s ease; }
  .trending-card .tc-item { display: flex; align-items: center; justify-content: space-between; width: 100%; flex-shrink: 0; }
  .trending-card .tc-item .tc-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .trending-card .tc-num { width: 18px; height: 18px; border-radius: 4px; background: var(--color-brand-600); color: #fff; font-weight: var(--font-weight-bold); font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .trending-card .tc-text { font-weight: var(--font-weight-medium); font-size: 16px; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trending-card .tc-item .gicon { font-size: 20px; width: 20px; height: 20px; flex-shrink: 0; color: #000; }

  .timeline-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
  .timeline-head .th-title { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; }
  .timeline-head .th-sort { display: flex; align-items: center; gap: 4px; font-size: 14px; color: #000; }
  .timeline-head .th-sort .gicon { font-size: 18px; width: 18px; height: 18px; color: #000; }

  .timeline-list { position: relative; padding: 0 20px 20px 51px; display: flex; flex-direction: column; gap: 20px; }
  /* top/height are set by JS to span exactly from the first dot's center to the
     last dot's center — card heights vary with content, so a fixed top/bottom
     guess either goes invisible (sub-pixel border-left on some mobile browsers)
     or overshoots past the last dot. background-image (not border) renders the
     dashes reliably at any DPI. */
  .timeline-line { position: absolute; left: 24.5px; top: 0; width: 2px; height: 0; background-image: repeating-linear-gradient(to bottom, #82B0F9 0, #82B0F9 4px, transparent 4px, transparent 8px); }
  .timeline-card {
    position: relative; border: 1px solid #E6E9F0; border-radius: 16px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .timeline-card::before {
    content: ''; position: absolute; left: -31px; top: 24px; width: 11px; height: 11px; border-radius: 50%; background: #82B0F9;
  }
  .timeline-card.first::before { background: var(--color-brand-600); }
  .timeline-card .tl-time { font-weight: var(--font-weight-medium); font-size: 14px; color: #5B5E73; }
  .timeline-card.first .tl-time { font-weight: var(--font-weight-bold); color: var(--color-brand-600); }
  .timeline-card .tl-body { display: flex; gap: 16px; align-items: flex-start; }
  .timeline-card .tl-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  /* line-clamp (not a fixed px height) so real API titles/descriptions -
     often longer than the original mock text - ellipsize cleanly at the
     same line count the mock content already fit in, instead of the
     mock-only fixed height silently mid-word clipping longer real text. */
  .timeline-card .tl-title { font-weight: var(--font-weight-bold); font-size: 16px; color: #000; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .timeline-card .tl-desc { font-weight: var(--font-weight-regular); font-size: 14px; color: #101112; margin-top: 4px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .timeline-card .tl-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .timeline-card .tl-tags span { border: 1px solid var(--color-border-default); border-radius: 999px; padding: 8px 12px; font-size: 10px; color: #000; }
  .timeline-card .tl-thumb { width: 61px; height: 61px; border-radius: 5.526px; object-fit: cover; flex-shrink: 0; }
  .timeline-card.filtered-out { display: none; }
  .timeline-empty { display: none; padding: 40px 20px; text-align: center; font-size: 14px; color: #868686; }
</style>

<script>
  (function () {
    var track = document.getElementById('tc-track');
    var items = track.querySelectorAll('.tc-item');
    var realCount = items.length - 1; // last item is the clone of #1, used for a seamless loop
    // offsetHeight, not getBoundingClientRect().height: the desktop portfolio mockup
    // (assets/js/device-mockup.js) applies `transform: scale(...)` to an ancestor
    // (.iphone-device) sized off window.innerWidth/innerHeight, so it never gets cut
    // off on a short/narrow desktop window. getBoundingClientRect() reports the
    // POST-scale, on-screen size — e.g. 19.2px instead of the item's real 20px at
    // scale 0.96 — while this value is then used as a LOCAL translateY step on
    // .tc-track, which (like any CSS transform) operates in the track's own
    // pre-ancestor-scale coordinate space. Feeding it a scaled length made every
    // slide undershoot by (1 - scale) * itemHeight, an error that compounds every
    // tick (index * itemHeight), which is exactly why the stop position drifted
    // further off target the longer the ticker ran, only on the scaled-down mockup,
    // and only when the window was short/narrow enough for the mockup's fit-to-
    // viewport scale to kick in. offsetHeight is a layout-box measurement, immune to
    // any ancestor's transform (scale or otherwise), so it stays correct at any
    // mockup scale — the fixed 402x874 app screen's own coordinate system, kept
    // separate from the browser viewport that the mockup scale reacts to.
    var itemHeight = items[0].offsetHeight;
    var index = 0;

    document.getElementById('tc-viewport').style.height = itemHeight + 'px';

    items.forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-article-id');
        window.location.href = id ? 'article.html?id=' + encodeURIComponent(id) : 'article.html';
      });
    });

    setInterval(function () {
      index += 1;
      track.style.transition = 'transform 0.5s ease';
      track.style.transform = 'translateY(-' + (index * itemHeight) + 'px)';
      if (index === realCount) {
        setTimeout(function () {
          track.style.transition = 'none';
          track.style.transform = 'translateY(0px)';
          index = 0;
        }, 500);
      }
    }, 2500);
  })();
  document.querySelectorAll('.timeline-card').forEach(function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-article');
      window.location.href = id ? 'article.html?id=' + encodeURIComponent(id) : 'article.html';
    });
  });

  document.querySelector('.th-sort').addEventListener('click', function () {
    EB.showToast('서비스 준비중입니다.');
  });

  var layoutTimelineLine = (function () {
    var list = document.querySelector('.timeline-list');
    var line = document.querySelector('.timeline-line');
    if (!list || !line) return function () {};
    var DOT_CENTER = 24 + 11 / 2; // matches .timeline-card::before's top:24px, 11px circle

    // Distance from `ancestor`'s own top edge to `el`'s top edge, walking the
    // offsetParent chain — entirely in `ancestor`'s local (pre-transform) coordinate
    // space. Unlike getBoundingClientRect(), this is unaffected by any ancestor's CSS
    // transform (e.g. the desktop portfolio mockup's `transform: scale(...)` on
    // .iphone-device — see assets/js/device-mockup.js): getBoundingClientRect()
    // reports the post-scale screen position, and assigning that straight into a
    // local CSS top/height (itself interpreted pre-scale, inside the same scaled
    // ancestor) double-applies the scale once the browser paints it — the line
    // rendered at scale^2 of its intended length instead of scale, landing short of
    // the last dot whenever the mockup was scaled down. offsetTop is a layout-box
    // value, immune to any ancestor transform, so it stays correct at any scale.
    function localTopWithin(el, ancestor) {
      var y = 0, node = el;
      while (node && node !== ancestor) {
        y += node.offsetTop;
        node = node.offsetParent;
      }
      return y;
    }

    return function layoutLine() {
      var cards = Array.prototype.filter.call(document.querySelectorAll('.timeline-card'), function (c) {
        return !c.classList.contains('filtered-out');
      });
      if (cards.length < 2) { line.style.height = '0px'; return; }
      var firstY = localTopWithin(cards[0], list) + DOT_CENTER;
      var lastY = localTopWithin(cards[cards.length - 1], list) + DOT_CENTER;
      line.style.top = firstY + 'px';
      line.style.height = Math.max(0, lastY - firstY) + 'px';
    };
  })();
  layoutTimelineLine();
  window.addEventListener('resize', layoutTimelineLine);
  window.addEventListener('load', layoutTimelineLine);

  // 카테고리 필터: 타임라인 카드의 실제 data-category를 기준으로 보이는 카드만
  // 남기고 나머지는 filtered-out으로 숨긴다("전체"는 전부 표시). 매칭되는 카드가
  // 하나도 없으면(예: 현재 목데이터에 없는 카테고리) 빈 상태 문구를 보여준다.
  document.querySelectorAll('.filter-row button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filter-row button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');

      var category = btn.getAttribute('data-category');
      var visibleCount = 0;
      document.querySelectorAll('.timeline-card').forEach(function (card) {
        var matches = category === 'all' || card.getAttribute('data-category') === category;
        card.classList.toggle('filtered-out', !matches);
        if (matches) visibleCount++;
      });
      document.getElementById('timeline-list').style.display = visibleCount ? '' : 'none';
      document.getElementById('timeline-empty').style.display = visibleCount ? 'none' : 'block';
      layoutTimelineLine();
    });
  });
</script>

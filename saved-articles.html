<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.ico" />
<title>이코노미브리프 - 저장한 기사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="design-system/tokens/colors.css" />
<link rel="stylesheet" href="design-system/tokens/typography.css" />
<link rel="stylesheet" href="design-system/tokens/layout.css" />
<link rel="stylesheet" href="assets/css/common.css" />
<link rel="stylesheet" href="assets/css/device-mockup.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .scroll-area { padding-bottom: 20px; }
  .section-white { background: #ffffff; padding: 20px; }

  .news-list { display: flex; flex-direction: column; }
  .news-list .news-item {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    width: 100%; background: none; border: none; text-align: left;
    font-family: inherit; color: inherit; cursor: pointer;
    padding: 16px 0; border-bottom: 1px solid var(--color-border-default);
  }
  .news-list .news-item:first-child { padding-top: 0; }
  .news-list .news-item:last-child { border-bottom: none; padding-bottom: 0; }
  .news-list .news-info { display: flex; flex-direction: column; justify-content: center; gap: 4px; width: 266px; }
  .news-list .news-title { font-weight: var(--font-weight-bold); font-size: 16px; color: #000000; line-height: 1.3; }
  .news-list .news-desc {
    font-weight: var(--font-weight-regular); font-size: 13px; color: #5B5B5B; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .news-list .news-byline { display: flex; align-items: center; gap: 4px; font-weight: var(--font-weight-regular); font-size: 12px; color: #5B5B5B; }
  .news-list .news-thumb { width: 56px; height: 56px; border-radius: 5.526px; object-fit: cover; flex-shrink: 0; }
  .news-list .eb-thumb-placeholder { width: 56px; height: 56px; border-radius: 5.526px; }

  .empty-state { padding: 60px 20px; text-align: center; color: #5B5E73; font-size: 14px; line-height: 1.6; }
  .empty-state .gicon { font-size: 40px; width: 40px; height: 40px; color: #C2C6D1; display: block; margin: 0 auto 12px; }
</style>
</head>
<body>

<div class="portfolio-stage">
<div class="iphone-device">
<div class="device-bezel">
<div class="app-screen">
<div class="dynamic-island"></div>
<div class="ios-status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <img src="assets/img/icons/status-bar-levels.svg" alt="" width="100" height="22" />
  </div>
</div>

<div class="device">
  <div class="scroll-area">

    <div data-eb="nav-header" data-title="저장한 기사" data-back="mypage.html" data-right="none" data-short="true"></div>

    <div class="section-white">
      <div class="news-list" id="saved-list"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <span class="gicon" role="img" aria-label="">bookmark</span>
        저장한 기사가 없어요<br />관심 있는 기사를 저장해보세요.
      </div>
    </div>

  </div>
</div>
</div>
</div>
</div>
</div>

<script src="assets/js/device-mockup.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/news-data-source.js"></script>
<script src="assets/js/api-news-client.js"></script>
<script src="assets/js/news-data.js"></script>
<script>
  window.EBNews.loadArticles().then(function (allArticles) {
    var savedIds = EB.savedArticles.getAll();
    var byId = {};
    allArticles.forEach(function (a) { byId[a.id] = a; });
    var saved = savedIds.map(function (id) { return byId[id]; }).filter(Boolean);

    var list = document.getElementById('saved-list');
    var empty = document.getElementById('empty-state');
    empty.style.display = saved.length ? 'none' : 'block';

    saved.forEach(function (a) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'news-item';

      var info = document.createElement('div');
      info.className = 'news-info';
      var title = document.createElement('div');
      title.className = 'news-title';
      title.textContent = a.title;
      var desc = document.createElement('div');
      desc.className = 'news-desc';
      desc.textContent = a.description || '';
      var byline = document.createElement('div');
      byline.className = 'news-byline';
      byline.innerHTML = '<span></span><span>·</span><span></span>';
      byline.children[0].textContent = a.source;
      byline.children[2].textContent = window.EBNews.formatDate(a.date);
      info.append(title, desc, byline);

      var thumb = document.createElement('img');
      thumb.className = 'news-thumb';
      thumb.alt = '';
      thumb.loading = 'lazy';

      btn.append(info, thumb);
      list.appendChild(btn);

      if (a.image) thumb.src = a.image;
      else EB.media.showThumbPlaceholder(thumb, a.imagePlaceholder);

      btn.addEventListener('click', function () {
        window.location.href = 'article.html?id=' + encodeURIComponent(a.id);
      });
    });
  });
</script>

</body>
</html>
